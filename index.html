<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夜诊 (Night Clinic)</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise-overlay"></div>
    <main class="app">
      <header class="titlebar">
        <h1>夜诊</h1>
        <div class="status-indicators">
          <span id="sanityIndicator">理智</span>
        </div>
      </header>

      <!-- 新增：图片展示区 -->
      <section id="imagePanel" class="panel panel-image hidden">
        <div class="image-wrapper">
          <img id="sceneImage" src="" alt="scene image" />
          <div class="image-filter"></div>
        </div>
      </section>

      <section class="panel panel-story">
        <div id="ambientText" class="ambient-text"></div>
        <pre id="story"></pre>
      </section>

      <section class="panel panel-choices">
        <div id="choices"></div>
      </section>

      <section class="panel panel-meta">
        <div class="meta-row">
          <button id="restartBtn" class="choice restart">重新排队</button>
        </div>
        <div id="endingBook" class="ending-book"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
